
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Innovative UI Design</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
    </head>

    <body>
      <script>
        window.addEventListener('error', function(e) {
          const div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.top = '0';
          div.style.left = '0';
          div.style.width = '100vw';
          div.style.height = '100vh';
          div.style.backgroundColor = 'rgba(20, 0, 0, 0.95)';
          div.style.color = '#ff4d4d';
          div.style.padding = '30px';
          div.style.fontFamily = 'monospace';
          div.style.fontSize = '16px';
          div.style.zIndex = '999999';
          div.style.overflow = 'auto';
          div.innerHTML = '<h1>RUNTIME ERROR DETECTED</h1><hr><pre>' + e.message + '\\n\\n' + (e.error ? e.error.stack : '') + '</pre>';
          document.body.appendChild(div);
        });
        window.addEventListener('unhandledrejection', function(e) {
          const div = document.createElement('div');
          div.style.position = 'fixed';
          div.style.top = '0';
          div.style.left = '0';
          div.style.width = '100vw';
          div.style.height = '100vh';
          div.style.backgroundColor = 'rgba(20, 0, 0, 0.95)';
          div.style.color = '#ff9900';
          div.style.padding = '30px';
          div.style.fontFamily = 'monospace';
          div.style.fontSize = '16px';
          div.style.zIndex = '999999';
          div.style.overflow = 'auto';
          div.innerHTML = '<h1>UNHANDLED REJECTION DETECTED</h1><hr><pre>' + e.reason + '\\n\\n' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre>';
          document.body.appendChild(div);
        });
      </script>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
